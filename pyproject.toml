[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fetchly"
version = "0.1.0"
description = "A download manager that speeds up downloads with parallel HTTP range requests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fetchly = "fetchly.cli:main"

[project.gui-scripts]
fetchly-gui = "fetchly.gui.app:main"

[tool.setuptools.packages.find]
include = ["fetchly*"]

[tool.setuptools.package-data]
"fetchly.gui" = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
