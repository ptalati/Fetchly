# Builds Fetchly for Windows, macOS and Linux and attaches the files to a GitHub release.
# Trigger: push a tag like v0.1.0  (git tag v0.1.0 && git push origin v0.1.0)
# or run it by hand from the Actions tab (builds only, no release).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Fetchly-Windows-Setup.exe
          - os: macos-latest
            asset: Fetchly-macOS.dmg
          - os: ubuntu-22.04
            asset: Fetchly-Linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller pillow

      - name: Test
        run: python -m pytest -q

      - name: Version
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || v="0.0.0-dev"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Freeze with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/fetchly.spec

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\fetchly.iss

      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir dmg && cp -R dist/Fetchly.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Fetchly -srcfolder dmg -ov -format UDZO dist/Fetchly-macOS.dmg

      - name: Linux archive
        if: runner.os == 'Linux'
        run: |
          cp packaging/fetchly.desktop packaging/fetchly-1024.png dist/Fetchly/
          tar -C dist -czf dist/Fetchly-Linux-x86_64.tar.gz Fetchly

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build browser extension zips
        run: |
          pip install pillow
          python browser-extension/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: browser-extension/dist/*.zip
          if-no-files-found: error

  release:
    needs: [build, extension]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "Fetchly $GITHUB_REF_NAME" --generate-notes
